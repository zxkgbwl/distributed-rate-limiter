services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  app:
    image: rate-limiter-app:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RATELIMITER_CAPACITY: 50
      RATELIMITER_REFILL_RATE: 2.0
    depends_on:
      redis:
        condition: service_healthy
